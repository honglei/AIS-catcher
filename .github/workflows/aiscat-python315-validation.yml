name: aiscat — Python wheel regression validation

on:
  push:
    branches: [validate-python315-clean]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build configured CPython wheels (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and test configured CPython wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: x86_64
        with:
          package-dir: python

      - uses: actions/upload-artifact@v7
        with:
          name: python-linux-x86_64
          path: ./wheelhouse/*.whl
