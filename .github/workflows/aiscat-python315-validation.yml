name: aiscat — Python 3.15 clean-config validation

on:
  push:
    branches: [validate-python315-clean]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build cp315/cp315t (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and test Python 3.15 wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: x86_64
          CIBW_BUILD: "cp315-* cp315t-*"
        with:
          package-dir: python

      - uses: actions/upload-artifact@v7
        with:
          name: python315-linux-x86_64
          path: ./wheelhouse/*.whl
